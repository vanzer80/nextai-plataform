name: Keep Supabase Alive

on:
  schedule:
    # GitHub cron runs in UTC. This is 08:00 in America/Sao_Paulo.
    - cron: '0 11 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Validate secrets
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"

      - name: Ping Supabase REST API
        run: |
          curl --fail-with-body --show-error --silent --max-time 20 --retry 3 --retry-delay 5 \
            "${SUPABASE_URL%/}/rest/v1/tenants?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json" \
            -o /dev/null
