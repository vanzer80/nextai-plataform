name: A11y Audit (axe diff)

on:
  pull_request:
    paths:
      - 'src/**'
      - 'components/**'
      - 'audit/**'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL base para auditoria (deixe vazio para usar o secret AUDIT_BASE_URL)'
        required: false
        default: ''

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  axe-diff:
    name: Axe accessibility diff
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: audit/package-lock.json

      - name: Install audit dependencies
        working-directory: audit
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: audit
        run: npx playwright install --with-deps chromium

      - name: Determine base URL
        id: url
        run: |
          OVERRIDE="${{ github.event.inputs.base_url }}"
          if [ -n "$OVERRIDE" ]; then
            echo "base_url=$OVERRIDE" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=${{ secrets.AUDIT_BASE_URL }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run axe audit
        working-directory: audit
        env:
          AUDIT_BASE_URL: ${{ steps.url.outputs.base_url }}
          AUDIT_USER:     ${{ secrets.AUDIT_USER }}
          AUDIT_PASS:     ${{ secrets.AUDIT_PASS }}
        run: node run-audit.mjs && node report-gen.mjs

      - name: Diff axe results against baseline
        working-directory: audit
        run: node check-axe-diff.mjs

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ github.run_id }}
          path: |
            audit/audit-output/REPORT.md
            audit/audit-output/screenshots/
          retention-days: 14
