<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NextAI</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NextAI" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />

    <!-- SEO / Open Graph -->
    <meta name="description" content="Plataforma de gestão para equipes de campo" />

    <script>
      (function () {
        var STORAGE_KEY = 'portal-theme';
        var storedTheme = localStorage.getItem(STORAGE_KEY);
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme =
          storedTheme === 'light' || storedTheme === 'dark' || storedTheme === 'system'
            ? storedTheme
            : 'light';
        var resolvedTheme = theme === 'system' ? (prefersDark ? 'dark' : 'light') : theme;
        var root = document.documentElement;

        root.classList.toggle('dark', resolvedTheme === 'dark');
        root.style.colorScheme = resolvedTheme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
